name: Deploy studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh public blog and Gumroad content
        id: refresh
        continue-on-error: true
        run: node sync-content.mjs
      - name: Save refreshed content for future fallback
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Refresh published products and blog posts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'A source could not refresh. Existing content was retained; review the refresh warnings.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

